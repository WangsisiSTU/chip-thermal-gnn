# Paired corrected-source and die-gradient benchmark. All models share the
# physical cases, objective, optimizer and training schedule.
seed: 2024
model:
  hidden_dim: 64
  n_message_passing_steps: 3
  dropout: 0.03
  aggregation: mean
baseline_model:
  type: sage
  hidden_dim: 64
  n_layers: 3
  dropout: 0.03
hybrid_model:
  hidden_dim: 64
  n_message_passing_steps: 3
  attention_blocks: 1
  attention_heads: 4
  attention_slices: 8
  dropout: 0.03
  aggregation: mean
  global_gate: true
train:
  batch_size: 2
  cpu_num_threads: 4
  epochs: 60
  lr: 1.0e-3
  weight_decay: 1.0e-5
  patience: 15
  peak_loss_weight: 0.1
  peak_loss_type: global_max
  gradient_loss_weight: 0.1
  loss_type: per_sample_rel
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 7
  grad_clip_norm: 1.0
