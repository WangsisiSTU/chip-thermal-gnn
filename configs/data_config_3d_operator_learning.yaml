geometry:
  width: 0.020
  depth: 0.016
  substrate_thickness: 0.006
  cu_thickness: 0.003
  tim_thickness: 0.001
  die_thickness: 0.002
  nx: 13
  ny: 13
  nz: 11
materials:
  k_die: {low: 120.0, high: 170.0}
  k_tim: {low: 0.5, high: 10.0}
  k_cu: {low: 340.0, high: 410.0}
